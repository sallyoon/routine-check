strong{color:#244e36;text-decoration:underline;text-underline-offset:4px}.monthday.blank{visibility:hidden}.calendarkey{display:flex;gap:12px;align-items:center;font-size:11px;margin:12px 0 0;color:#536650;flex-wrap:wrap}.calendarkey span{display:flex;gap:5px;align-items:center}.keybox{width:9px;height:9px;border-radius:3px;background:#deecdf}.keybox.practice{background:#f0e6ce}.daydetail{padding-top:25px;margin-top:15px;border-top:1px solid #e0e7db}.daydetail .sectionhead{margin-bottom:13px}.daydetail h2,.charthead h2{font-size:16px}.daycards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.daycard{padding:13px 12px;background:#fff;border:1px solid #e1e8dd;border-radius:12px;min-width:0}.daycard .cardname{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600}.daycard strong{font-size:18px;display:block;margin-top:8px}.daycard small{font-size:11px;display:block;margin-top:6px;line-height:1.5;word-break:keep-all;color:#53674f}.daycard.complete{background:#edf4e9}.charthead{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px;gap:8px}.charthead span{font-size:12px}.comparison{display:flex;gap:14px;align-items:flex-end;padding:4px 10px 0;min-height:150px}.chartcol{flex:1;min-width:0;text-align:center}.chartvalue{font-size:13px;display:block;margin-bottom:9px;font-weight:600;font-variant-numeric:tabular-nums}.chartplot{height:112px;display:flex;justify-content:center;align-items:flex-end}.chartstack{display:flex;flex-direction:column;width:min(46px,75%);height:100%;border-radius:8px;overflow:hidden;background:#e3e8df}.chartfill{width:100%;border-radius:0;background:var(--person-color)}.chartremaining{width:100%;background:#e3e8df}.chartname{display:block;font-size:12px;margin-top:10px}.chartcol.dimmed{opacity:.35}.statusnotice{font-size:12px;text-align:center;padding:13px 0 0;color:#815f29}.chartlegend{display:flex;justify-content:center;gap:18px;font-size:11px;margin-top:17px}.chartlegend span{display:flex;align-items:center;gap:6px}.chartlegend i{width:8px;height:8px;border-radius:2px}.actualkey{background:#3e7963}.remainingkey{background:#e3e8df}.chartblock{margin-bottom:27px;padding-bottom:24px;border-bottom:1px solid #e0e7db}.daycard small.routineGroup{font-weight:650;color:#304f3b;margin-top:11px}#status{padding-bottom:0}body:has(#status:not([hidden])) main{padding-bottom:35px}#password{font-size:20px}#password::placeholder{font-size:15px}#person,#mode{font-size:16px}#ask{position:fixed;inset:0;background:#20362c66;display:flex;align-items:center;justify-content:center;z-index:20}#ask div.box{background:#fff;border-radius:14px;padding:22px;width:calc(100% - 40px);max-width:320px}#ask p{margin:0 0 18px;line-height:1.6}#ask .row{display:flex;gap:8px;justify-content:flex-end}#ask button{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid #d8e1d6;background:#fff}#ask button.yes{background:#315c43;color:#fff;border-color:#315c43}</style>
<main><header><h1 id="pageTitle">루틴 인증하기</h1><div class="account"><span id="account"></span><button id="logout" class="quiet" hidden>로그아웃</button></div></header><div id="loading">불러오는 중</div><div id="app" hidden><nav class="tabs" aria-label="화면"><button id="checkTab" class="active" type="button">인증</button><button id="statusTab" type="button">현황</button></nav><section class="calendar" aria-label="주간 인증 캘린더"><div class="weekbar"><button id="prev" class="arrow" aria-label="이전 주">‹</button><select id="weekSelect" aria-label="주차 선택"></select><button id="next" class="arrow" aria-label="다음 주">›</button></div><span id="phase" class="phase"></span><div class="weekdays" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div id="days" class="days"></div></section><section id="auth" hidden><form id="loginForm" class="authbox"><h2>로그인</h2><label for="person" class="field">이름</label><select id="person" required></select><label for="password" class="field">비밀번호 4자리</label><input id="password" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" placeholder="숫자 4자리" required><button id="loginButton" class="primary">로그인</button><p class="authnote">처음 로그인하면 입력한 숫자 4자리가 내 비밀번호로 저장됩니다.</p></form></section><section id="cert"><div class="sectionhead"><h2 id="selectedDate"></h2><span id="readOnly" class="badge" hidden></span></div><div id="modeWrap" hidden><label for="mode" class="field">야근 여부 (저녁 취침 루틴 선택)</label><select id="mode"><option value="">선택</option><option value="normal">야근 안 하는 날</option><option value="overtime">야근 하는 날</option></select></div><input id="date" type="hidden"><form id="form"><div id="checks"></div><div id="submitbar" class="submitbar"><button id="submit" class="primary" disabled>인증하기</button></div></form></section><section id="status" hidden><div class="chartblock"><div class="charthead"><h2 id="chartTitle">주간 인증 / 목표</h2><span id="chartWeek"></span></div><div id="comparison" class="comparison" role="img" aria-label="참가자별 주간 달성률 비교"></div><div class="chartlegend"><span><i class="actualkey"></i>인증</span><span><i class="remainingkey"></i>남은 목표</span></div><div id="chartNotice" class="statusnotice" hidden></div></div><div class="monthhead"><button id="monthPrev" type="button" class="arrow" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button id="monthNext" type="button" class="arrow" aria-label="다음 달">›</button></div><div id="filters" class="filters" aria-label="현황 이름 선택"></div><div class="weekdays" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div id="monthGrid" class="monthgrid" aria-label="월간 인증 현황"></div><div class="calendarkey"><span><i class="keybox"></i>인증 완료</span><span><i class="keybox practice"></i>연습</span><span id="cellLabel">완료 인원 / 참여 인원</span></div><div class="daydetail"><div class="sectionhead"><h2 id="detailDate"></h2><span id="detailPhase" class="badge"></span></div><div id="dayCards" class="daycards"></div></div><div class="refresh"><button id="refresh" class="quiet" type="button">새로고침 ↻</button></div></section></div></main>
<div id="message" role="status" aria-live="polite" hidden></div>
<div id="ask" hidden><div class="box"><p id="askText"></p><div class="row"><button id="askNo" type="button">취소</button><button id="askYes" type="button" class="yes">확인</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=id=>document.getElementById(id),node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const CFG={start:'2026-11-12',end:'2026-12-30',routineStart:'2026-11-14',practiceStart:'2026-11-16',practiceEnd:'2026-11-22',scoringStart:'2026-11-23'};
const PEOPLE=[{id:'yjh',name:'윤지혜'},{id:'yjs',name:'윤재성'},{id:'lsh',name:'이성혁'},{id:'kyd',name:'김용대'},{id:'nhi',name:'나혜인'}];
// condition: all = 항상, normal = 야근 안 하는 날, overtime = 야근 하는 날 / group: days = 하루 전체를 1일로 집계, routine = 루틴별 횟수 집계
const mk=(id,pid,title,target,condition,group)=>({id,pid,title,target,condition,group,start:CFG.routineStart,end:CFG.end});
const R=[mk('r-lee-desk','lsh','06:20 출근 준비 끝내고 책상 앉기',5,'all','days'),mk('r-lee-bed-2140','lsh','21:40에 눕기',5,'normal','days'),mk('r-lee-bed-2300','lsh','23:00에 눕기',5,'overtime','days'),mk('r-kim-read','kyd','독서하기',5,'all','routine'),mk('r-kim-journal','kyd','일기쓰기',5,'all','routine'),mk('r-yoon-phone','yjh','핸드폰 책상 위에 두고 잠들기',7,'all','routine'),mk('r-js-words','yjs','매일 영어단어 5개 암기',7,'all','routine'),mk('r-js-pushup','yjs','push up 50개',7,'all','routine'),mk('r-js-diary','yjs','아침 생각정리 일기 10분 쓰기',7,'all','routine'),mk('r-nhi-english','nhi','비즈니스 영어 챕터 1개 공부',7,'all','routine')];
let db=null,checks={},data=null,busy=false,baseline='',photos={},previews={},requestId='',timer,tab='check',session={},statusMonth='',statusDate='',statusFilter='';
try{session=JSON.parse(localStorage.getItem('routine.session')||'{}');}catch(e){}
function persist(){try{localStorage.setItem('routine.session',JSON.stringify(session));}catch(e){}}
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dates_=(a,b)=>{const r=[];for(let d=new Date(a+'T00:00:00Z');d.toISOString().slice(0,10)<=b;d.setUTCDate(d.getUTCDate()+1))r.push(d.toISOString().slice(0,10));return r;};
const week_=date=>{const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));const start=d.toISOString().slice(0,10);d.setUTCDate(d.getUTCDate()+6);return {start,end:d.toISOString().slice(0,10)};};
const phase_=d=>d>=CFG.scoringStart?'official':d>=CFG.practiceStart&&d<=CFG.practiceEnd?'practice':'preparation';
const weeks_=()=>dates_(week_(CFG.start).start,week_(CFG.end).start).filter((d,i)=>i%7===0).map(start=>{const w=week_(start),phase=phase_(start),number=phase==='official'?Math.round((new Date(start+'T00:00:00Z')-new Date(CFG.scoringStart+'T00:00:00Z'))/604800000)+1:0;return {...w,phase,number,label:phase==='practice'?'연습':phase==='official'?number+'주차':''};});
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const key=(d,p)=>d+'_'+p,applies=(r,d,mode)=>r.start<=d&&r.end>=d&&(r.condition==='all'||r.condition===mode);
const modeOf=(p,d)=>checks[key(d,p)]?.mode||'',doneOn=(r,d)=>checks[key(d,r.pid)]?.items?.[r.id]?.done===true;
// 하루 단위 상태: 야근 여부를 아직 고르지 않았으면 저녁 루틴이 남은 것(pending)으로 본다
function dayInfo(pid,d){const mode=modeOf(pid,d),sched=R.filter(r=>r.pid===pid&&r.start<=d&&r.end>=d);return {mode,sched,exp:sched.filter(r=>applies(r,d,mode)),pending:!mode&&sched.some(r=>r.condition!=='all')};}
function summary(w,dates,t){const scored=w.phase==='official',wd=dates.filter(d=>d>=w.start&&d<=w.end&&d<=t);
 return PEOPLE.map(p=>{const rs=R.filter(r=>r.pid===p.id),isDays=rs.some(r=>r.group==='days'),details=rs.map(r=>{const c=wd.filter(d=>applies(r,d,modeOf(p.id,d))&&doneOn(r,d));return {id:r.id,title:r.title,target:r.target,recorded:c.length,done:c.filter(d=>d>=CFG.scoringStart).length};});let recorded=0,count=0,target=0;
  if(isDays){const comp=wd.filter(d=>{const i=dayInfo(p.id,d);return i.exp.length&&!i.pending&&i.exp.every(r=>doneOn(r,d));});recorded=comp.length;target=Math.max(0,...rs.map(r=>r.target));count=Math.min(comp.filter(d=>d>=CFG.scoringStart).length,target);}
  else{recorded=details.reduce((n,r)=>n+r.recorded,0);target=details.reduce((n,r)=>n+r.target,0);count=details.reduce((n,r)=>n+Math.min(r.done,r.target),0);}
  return {id:p.id,name:p.name,unit:isDays?'일':'회',done:scored?count:0,recorded,target:scored?target:0,configuredTarget:target,scored,details};});}
function build(sel,date){
 const t=today(),cut=t<CFG.end?t:CFG.end,dates=dates_(CFG.start,CFG.end),weeks=weeks_();if(!dates.includes(date))date=cut<CFG.start?CFG.start:cut;
 const mine=R.filter(r=>r.pid===sel),docs=Object.values(checks).filter(c=>c.pid===sel);
 return {people:PEOPLE,selected:sel,date,today:t,start:CFG.start,end:CFG.end,practiceStart:CFG.practiceStart,practiceEnd:CFG.practiceEnd,scoringStart:CFG.scoringStart,
  phase:phase_(date),week:weeks.find(w=>w.start<=date&&w.end>=date),weeks,dates,weekSummaries:weeks.map(w=>({start:w.start,summary:summary(w,dates,t)})),
  needsMode:mine.some(r=>r.condition!=='all'),mode:sel?modeOf(sel,date):'',modes:docs.map(c=>({date:c.date,mode:c.mode})),routines:mine,
  history:docs.flatMap(c=>Object.entries(c.items||{}).map(([id,i])=>({date:c.date,routine:id,done:i.done===true,photo:!!i.photo}))),
  groupDays:dates.map(d=>({date:d,people:PEOPLE.map(p=>{const i=dayInfo(p.id,d),items=i.exp.map(r=>({title:r.title,done:doneOn(r,d)})),done=items.filter(x=>x.done).length,total=items.length+(i.pending?1:0);return {id:p.id,active:i.sched.length>0,total,done,full:total>0&&!i.pending&&done===total,items,displayItems:(i.mode?i.exp:i.sched).map(r=>({title:r.title,condition:r.condition,done:applies(r,d,i.mode)&&doneOn(r,d)}))};})}))};
}
function message(text,error=false){clearTimeout(timer);$('message').textContent=text;$('message').className=error?'error':'';$('message').hidden=false;timer=setTimeout(()=>$('message').hidden=true,4500);}
function ask(text){return new Promise(ok=>{$('askText').textContent=text;$('ask').hidden=false;const done=v=>{$('ask').hidden=true;ok(v);};$('askYes').onclick=()=>done(true);$('askNo').onclick=()=>done(false);});}
function eligible(date,mode){return data?data.routines.filter(r=>applies(r,date,mode)):[];}
function current(){return JSON.stringify({checks:[...$('checks').querySelectorAll('.check input:checked')].map(i=>i.value).sort(),mode:$('mode').value,photos:Object.keys(photos).sort()});}
